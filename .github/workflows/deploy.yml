name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Create Kamal secrets file
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          {
            printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$KAMAL_REGISTRY_PASSWORD"
            printf 'RAILS_MASTER_KEY=%s\n' "$RAILS_MASTER_KEY"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
          } > .kamal/secrets

      - name: Deploy with Kamal
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_ref=$(git ls-remote --exit-code origin refs/heads/main)
          main_sha=$(printf '%s\n' "$main_ref" | cut -f1)

          if [ "$CI_SHA" != "$main_sha" ]; then
            echo "main の先頭と一致しないため、デプロイを見送ります"
            echo "CIの対象SHA: $CI_SHA"
            echo "現在のmainのSHA: $main_sha"
            exit 0
          fi

          bin/kamal deploy